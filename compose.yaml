services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: story_rpg
      POSTGRES_USER: story
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["story-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story -d story_rpg"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  story-postgres:
